name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node tools/build.js
      - name: Check the calculator against in-game numbers
        run: npm test
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/web

  pages:
    name: Publish website
    needs: web
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  windows:
    name: Windows app
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: node tools/build.js
      - name: Check the calculator against in-game numbers
        run: npm test
      - run: npx tauri build
      - name: Name the files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe out/NightreignRelicPlanner-Setup.exe
          Copy-Item src-tauri/target/release/nightreign-relic-planner.exe out/NightreignRelicPlanner-Portable.exe
          Get-ChildItem out | Format-Table Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: NightreignRelicPlanner-windows
          path: out/*.exe
      - name: Read version
        id: ver
        shell: pwsh
        run: echo "v=$((Get-Content package.json | ConvertFrom-Json).version)" >> $env:GITHUB_OUTPUT
      - name: Publish release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          target_commitish: ${{ github.sha }}
          name: Nightreign Relic Planner ${{ steps.ver.outputs.v }}
          make_latest: true
          files: out/*.exe
          body: |
            **NightreignRelicPlanner-Setup.exe** installs the app. **NightreignRelicPlanner-Portable.exe** runs without installing.

            Windows may say "Windows protected your PC" the first time, because the app isn't signed. Click **More info**, then **Run anyway**.

            The app finds your saves in `%APPDATA%\Nightreign` (NR0000.sl2 and Seamless Co-op NR0000.co2), only reads them, and updates your relics every time the game saves.
