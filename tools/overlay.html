<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nightreign overlay</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* The overlay: a small card over the game with this run's Nightlord and the Dreglord cycle timer.
   Window and page are transparent; only the card shows, and the window is sized to it.
   The card itself (what it shows and its look) lives in overlay-card.js, shared with the preview in Settings. */
html,body{margin:0;background:transparent;overflow:hidden;user-select:none;-webkit-user-select:none;cursor:default;color-scheme:dark}
#card{margin:4px;width:284px}   /* one width for every Nightlord, so the window doesn't jump between runs */
</style>
<script src="overlay-card.js"></script>
</head>
<body>
<div class="oc" id="card"></div>
<script>
// Settings and the run come from the planner window (events, and localStorage for when this window opens).
// The timer runs the Dreglord cycle from the moment you press the hotkey.
(function(){
  const T = window.__TAURI__, OC = window.NROverlayCard;
  const css = document.createElement('style'); css.textContent = OC.css; document.head.appendChild(css);
  const card = document.getElementById('card');
  let cfg = {key:'F8', cycle:20, start:1, zones:[{c:'g',a:2,b:15},{c:'r',a:15,b:2}], nl:true, timer:true, showTime:true, showBar:true, barH:8, mk:'#ffffff', simple:false, showZone:true, nlName:'boss'}, run = null;
  try { Object.assign(cfg, JSON.parse(localStorage.getItem('nr-overlay')||'{}')); } catch(e) {}
  try { run = JSON.parse(localStorage.getItem('nr-overlay-run')||'null'); } catch(e) {}
  let start = 0, moving = false, timer = null, lastH = 0, lastW = 0, lastPress = 0;
  const STOP_MS = 400;   // two presses this close together stop the timer
  // seconds into the cycle: from the start point at the press, wrapping at the cycle length; null before a press
  const now = () => start ? ((+cfg.start || 0) + (performance.now() - start) / 1000) % Math.max(1, +cfg.cycle || 20) : null;
  // the window follows the card's size
  function fit(){
    const r = card.getBoundingClientRect(), h = card.hidden ? 8 : Math.ceil(r.height + 8), w = card.hidden ? 240 : Math.ceil(r.width + 8);
    if ((h === lastH && w === lastW) || !T) return; lastH = h; lastW = w;
    T.core.invoke('overlay_fit', {h, w}).catch(() => {});
  }
  function draw(){
    if (cfg.timer === false) start = 0;
    const r = OC.render(cfg, run, now(), moving);
    card.hidden = r.empty; card.className = r.cls; card.innerHTML = r.html;
    if (moving) card.setAttribute('data-tauri-drag-region', ''); else card.removeAttribute('data-tauri-drag-region');
    card.querySelectorAll('*').forEach(el => moving ? el.setAttribute('data-tauri-drag-region','') : el.removeAttribute('data-tauri-drag-region'));
    fit();
  }
  function tick(){ draw(); if (!start && timer){ clearInterval(timer); timer = null; } }
  function stop(){ start = 0; lastPress = 0; tick(); }
  // a press (re)starts the cycle from the start point; a second press right after it stops the timer
  function go(){
    if (cfg.timer === false) return;
    const t = performance.now();
    if (start && t - lastPress < STOP_MS){ stop(); return; }
    lastPress = t; start = t; if (!timer) timer = setInterval(tick, 100); draw();
  }
  if (T){
    T.event.listen('overlay:hotkey', go);
    T.event.listen('overlay:stop', stop);
    T.event.listen('overlay:config', e => { Object.assign(cfg, e.payload||{}); draw(); });
    T.event.listen('overlay:run', e => { run = e.payload || null; draw(); });
    T.event.listen('overlay:locked', e => { moving = !e.payload; draw(); });
  }
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => fit());
  draw();
})();
</script>
</body>
</html>
