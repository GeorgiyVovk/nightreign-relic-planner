<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nightreign overlay</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* The overlay: a small card over the game with this run's Nightlord and the Dreglord cycle timer.
   Window and page are transparent; only the card shows, and the window is sized to it. */
:root{--fg:#DDE3EC;--muted:#8E9AB0;--accent:#AFC3E3;--good:#6CC48C;--bad:#E2685A;--ev:#B48AE8;--card:rgba(9,14,24,.78);--line:rgba(175,195,227,.22);color-scheme:dark}
html,body{margin:0;background:transparent;overflow:hidden;user-select:none;-webkit-user-select:none;cursor:default}
body{font-family:"Inter",system-ui,"Segoe UI",sans-serif;color:var(--fg)}
.card{margin:4px;border-radius:8px;background:var(--card);border:1px solid var(--line);padding:10px 14px;display:flex;flex-direction:column;gap:10px;box-sizing:border-box}
.card[hidden]{display:none}
.sec{display:flex;flex-direction:column;gap:8px}
.sec + .sec{border-top:1px solid var(--line);padding-top:10px}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.key{font-family:"IBM Plex Mono",ui-monospace,monospace;letter-spacing:0;border:1px solid var(--line);border-radius:4px;padding:0 5px}
.nl{display:flex;flex-direction:column;gap:2px}
.nlname{font-family:"EB Garamond",Georgia,serif;font-size:24px;font-weight:600;line-height:1.05}
.nlname .ev{color:var(--ev)}
.nlsub{font-size:12px;color:var(--muted)}
.main{display:flex;align-items:baseline;gap:8px}
.cap{font-size:13px;color:var(--muted)}
.big{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:38px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.big small{font-size:16px;color:var(--muted);margin-left:2px}
.zl{margin-left:auto;font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
/* the cycle bar: flat, square-cornered blocks with a dark seam at each zone edge, the part of the cycle already
   passed dimmed, and a playhead that stands out above and below the bar */
.trackw{position:relative;padding:4px 0}
.track{position:relative;height:8px;border-radius:2px;background:rgba(255,255,255,.12);overflow:hidden}
.track i{position:absolute;top:0;bottom:0;box-shadow:inset 1px 0 0 rgba(0,0,0,.55),inset -1px 0 0 rgba(0,0,0,.55)}
.track i.zg{background:#4FAF72} .track i.zr{background:#D2483A}
.track s{position:absolute;top:0;bottom:0;left:0;background:rgba(6,9,16,.5);text-decoration:none}
.trackw b{position:absolute;top:0;bottom:0;width:var(--mk,3px);margin-left:calc(var(--mk,3px) / -2);background:var(--mkc,#fff);border-radius:1px;box-shadow:0 0 0 1px rgba(0,0,0,.7)}
.zbig{font-size:26px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;line-height:38px}
.tm.safe .zbig{color:var(--good)} .tm.danger .zbig{color:var(--bad)}
.idle .big{font-size:22px;color:var(--muted);font-weight:500}
.idle .main{min-height:38px;align-items:center}   /* same height as a running timer, so the card doesn't jump */
.tm.safe .big,.tm.safe .zl{color:var(--good)}
.tm.danger .big,.tm.danger .zl{color:var(--bad)}
/* the frame takes the zone's colour, thick enough to read without the bar; drawn inside, so nothing moves */
.card.alert{border-color:var(--bad);box-shadow:inset 0 0 0 2px var(--bad)} .card.calm{border-color:var(--good);box-shadow:inset 0 0 0 2px var(--good)}
.move{border:1px dashed var(--accent);cursor:move}
/* simple mode: the timer part is filled with the zone's colour (green safe, red danger, white outside the zones)
   and shows only the zone's name; it fills out to the card's edges */
.tm.simple{margin:0 -14px -10px;padding:10px 14px;border-radius:0 0 7px 7px}
.card > .tm.simple:first-child{margin-top:-10px;border-radius:7px}
.sec + .tm.simple{border-top:0}
.tm.simple.safe{background:#3E9B60} .tm.simple.danger{background:#D2483A} .tm.simple.run{background:#F2F4F8}
.tm.simple.safe .top,.tm.simple.danger .top{color:rgba(255,255,255,.85)} .tm.simple.safe .key,.tm.simple.danger .key{border-color:rgba(255,255,255,.5)}
.tm.simple.safe .zbig,.tm.simple.danger .zbig{color:#fff}
.tm.simple.run .top{color:#4A5568} .tm.simple.run .key{border-color:rgba(0,0,0,.25)}
.tm.simple .main{min-height:38px;align-items:center}
.tm.simple.idle .zbig{color:var(--muted);font-weight:500;letter-spacing:0;text-transform:none;font-size:22px}
.hint{font-size:13px;color:var(--muted)}
</style>
</head>
<body>
<div class="card" id="card"></div>
<script>
// Settings and the run come from the planner window (events, and localStorage for when this window opens).
// The timer runs the Dreglord cycle from the moment you press the hotkey.
(function(){
  const T = window.__TAURI__;
  const card = document.getElementById('card');
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);
  let cfg = {key:'F8', cycle:20, start:1, zones:[{c:'g',a:2,b:15},{c:'r',a:15,b:2}], nl:true, timer:true, showTime:true, showBar:true, barH:8, mk:'#ffffff', simple:false, showZone:true}, run = null;
  try { Object.assign(cfg, JSON.parse(localStorage.getItem('nr-overlay')||'{}')); } catch(e) {}
  try { run = JSON.parse(localStorage.getItem('nr-overlay-run')||'null'); } catch(e) {}
  let start = 0, moving = false, timer = null, lastH = 0, lastW = 0, lastPress = 0;
  const STOP_MS = 400;   // two presses this close together stop the timer
  function nlHtml(){
    return `<div class="sec nl"><div class="top"><span>Nightlord</span>${run.don?'<span>Deep of Night</span>':''}</div>`
      + `<div class="nlname">${run.ev?'<span class="ev">Everdark</span> ':''}${esc(run.name)}</div><div class="nlsub">${esc(run.title)}</div></div>`;
  }
  // The cycle: from the press it counts from the start point up to the cycle length, then from 0 again, until stopped.
  // Zones colour parts of it: green safe, red danger, white where no zone is set. A zone may wrap (15 to 2).
  const cyc = () => Math.max(1, +cfg.cycle || 20);
  const zones = () => Array.isArray(cfg.zones) ? cfg.zones : [];
  const inZone = (z, t) => z.a === z.b ? false : z.a < z.b ? (t >= z.a && t < z.b) : (t >= z.a || t < z.b);
  const zoneAt = t => zones().find(z => inZone(z, t)) || null;
  const zname = z => z ? (z.c === 'r' ? 'Danger' : 'Safe') : '';
  function nextChange(t){
    const C = cyc(), cur = zoneAt(t); let best = null;
    for (const z of zones()) for (const e of [z.a, z.b]){ let d = (e - t + C) % C; if (d < 0.05) d += C; if (best === null || d < best) best = d; }
    if (best === null || best >= C) return null;
    const nx = zoneAt((t + best + 0.01) % C);
    if (nx === cur) return null;
    return nx ? `${zname(nx)} in ${best.toFixed(1)} s` : `${zname(cur)} ends in ${best.toFixed(1)} s`;
  }
  function trackHtml(t){
    const C = cyc(), segs = [];
    for (const z of zones()){
      const parts = z.a === z.b ? [] : z.a < z.b ? [[z.a, z.b - z.a]] : [[z.a, C - z.a], [0, z.b]];
      for (const [x, w] of parts) segs.push(`<i class="z${z.c === 'r' ? 'r' : 'g'}" style="left:${(x / C * 100).toFixed(2)}%;width:${(w / C * 100).toFixed(2)}%"></i>`);
    }
    // the bar can be made much taller in Settings, so it reads at a glance; the marker grows with it
    const h = Math.max(4, Math.min(80, +cfg.barH || 8)), mk = h >= 28 ? 5 : h >= 16 ? 4 : 3, at = t == null ? null : (t / C * 100).toFixed(2);
    // the playhead colour picked in Settings; 'danger' turns it yellow only while inside a danger zone
    const dz = t != null && (zoneAt(t) || {}).c === 'r';
    const mkc = cfg.mk === 'danger' ? (dz ? '#ffd43b' : '#ffffff') : /^#[0-9a-f]{6}$/i.test(cfg.mk || '') ? cfg.mk : '#ffffff';
    return `<div class="trackw" style="--mk:${mk}px;--mkc:${mkc}"><div class="track" style="height:${h}px">${segs.join('')}${at == null ? '' : `<s style="width:${at}%"></s>`}</div>${at == null ? '' : `<b style="left:${at}%"></b>`}</div>`;
  }
  // no label row: the timer is just the time, the zone's name and the bar, each of which can be turned off;
  // the hotkey shows only while it waits for the first press
  const readyHtml = cls => `<div class="sec tm ${cls} idle"><div class="main"><span class="${cls === 'simple' ? 'zbig' : 'big'}">Ready</span></div><span class="hint">Press ${esc(cfg.key||'the hotkey')} when the status shows</span>`;
  function timerHtml(){
    const bar = cfg.showBar !== false, nums = cfg.showTime !== false, names = cfg.showZone !== false;
    if (!start) return {state:'idle', html: readyHtml('') + (bar ? trackHtml(null) : '') + '</div>'};
    const C = cyc(), t = ((+cfg.start || 0) + (performance.now() - start) / 1000) % C, z = zoneAt(t), nx = nextChange(t);
    const state = z ? (z.c === 'r' ? 'danger' : 'safe') : 'run';
    // without the seconds, the zone name takes the big line (nothing there outside a zone)
    const main = nums ? `<div class="main"><span class="big">${t.toFixed(1)}<small>s</small></span>${z && names ? `<span class="zl">${zname(z)}</span>` : ''}</div><span class="hint">${nx || '&nbsp;'}</span>`
      : z && names ? `<div class="main"><span class="zbig">${zname(z)}</span></div>` : '';
    return {state, html:`<div class="sec tm ${state}">${main}${bar ? trackHtml(t) : ''}</div>`};
  }
  // the window follows the card's height
  let wantW = 240;
  function fit(){
    const h = card.hidden ? 8 : Math.ceil(card.getBoundingClientRect().height + 8), w = wantW;
    if ((h === lastH && w === lastW) || !T) return; lastH = h; lastW = w;
    T.core.invoke('overlay_fit', {h, w}).catch(() => {});
  }
  function simpleHtml(){
    if (!start) return {state:'idle', html: readyHtml('simple') + '</div>'};
    const t = ((+cfg.start || 0) + (performance.now() - start) / 1000) % cyc(), z = zoneAt(t);
    const state = z ? (z.c === 'r' ? 'danger' : 'safe') : 'run';
    return {state, html:`<div class="sec tm simple ${state}"><div class="main"><span class="zbig">${cfg.showZone !== false ? zname(z) : ''}</span></div></div>`};
  }
  function draw(){
    let html = '', alert = false;
    const nl = cfg.nl !== false && run, simple = cfg.simple === true && cfg.timer !== false;
    if (nl) html += nlHtml();
    let calm = false;
    if (cfg.timer === false) start = 0;
    else { const t = simple ? simpleHtml() : timerHtml(); html += t.html; alert = t.state === 'danger'; calm = t.state === 'safe'; }
    if (!html && moving) html = '<div class="sec"><span class="hint">Drag me</span></div>';
    card.hidden = !html;
    card.className = 'card' + (alert ? ' alert' : calm ? ' calm' : '') + (moving ? ' move' : '');
    card.innerHTML = html;
    if (moving) card.setAttribute('data-tauri-drag-region', ''); else card.removeAttribute('data-tauri-drag-region');
    card.querySelectorAll('*').forEach(el => moving ? el.setAttribute('data-tauri-drag-region','') : el.removeAttribute('data-tauri-drag-region'));
    fit();
  }
  function tick(){ draw(); if (!start && timer){ clearInterval(timer); timer = null; } }
  function stop(){ start = 0; lastPress = 0; tick(); }
  // a press (re)starts the cycle from the start point; a second press right after it stops the timer
  function go(){
    if (cfg.timer === false) return;
    const now = performance.now();
    if (start && now - lastPress < STOP_MS){ stop(); return; }
    lastPress = now; start = now; if (!timer) timer = setInterval(tick, 100); draw();
  }
  if (T){
    T.event.listen('overlay:hotkey', go);
    T.event.listen('overlay:stop', stop);
    T.event.listen('overlay:config', e => { Object.assign(cfg, e.payload||{}); draw(); });
    T.event.listen('overlay:run', e => { run = e.payload || null; draw(); });
    T.event.listen('overlay:locked', e => { moving = !e.payload; draw(); });
  }
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => fit());
  draw();
})();
</script>
</body>
</html>
