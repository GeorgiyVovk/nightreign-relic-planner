[package]
name = "nightreign-relic-planner"
version = "0.44.0"
description = "Plan Elden Ring Nightreign relic loadouts from your own save"
authors = ["GeorgiyVovk"]
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-updater = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
